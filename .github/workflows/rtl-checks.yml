name: Fresh selected RTL components

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rtl-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    name: Fresh component lint, elaboration and behavior (not full-chip signoff)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test driver coverage and warning refusal rules
        run: python3 -I -S -B -m unittest discover -s tools/hardware_ci -p 'test_runner.py' -v
      - name: Pull the immutable official Verilator image
        run: |
          RTL_CI_IMAGE=$(python3 -I -S -B -c 'import json; print(json.load(open("tools/hardware_ci/toolchain.json"))["container"])')
          docker pull "$RTL_CI_IMAGE"
          docker image inspect "$RTL_CI_IMAGE" > "$RUNNER_TEMP/rtl-image.json"
      - name: Compile and simulate all eight selected component cases
        run: |
          RTL_CI_IMAGE=$(python3 -I -S -B -c 'import json; print(json.load(open("tools/hardware_ci/toolchain.json"))["container"])')
          docker run --rm --network none --cpus 1 --memory 2g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/out" \
            --env "HARDWARE_CI_CONTAINER=$RTL_CI_IMAGE" \
            --entrypoint python3 "$RTL_CI_IMAGE" -I -S -B \
            /repo/tools/hardware_ci/runner.py --repository /repo --output /out/fresh-rtl
      - name: Elaborate both Qwen 1.7B targets and check protected K/V operands
        run: |
          RTL_CI_IMAGE=$(python3 -I -S -B -c 'import json; print(json.load(open("tools/hardware_ci/toolchain.json"))["container"])')
          docker run --rm --network none --cpus 1 --memory 4g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/out" \
            --entrypoint python3 "$RTL_CI_IMAGE" -I -S -B \
            /repo/demos/qwen3-1.7b/variants/protected-kv-simulation/run.py --output /out/qwen17-protected-kv
      - name: Retain actual commands, compiler output and terminal receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fresh-rtl-component-receipts
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/rtl-image.json
            ${{ runner.temp }}/fresh-rtl/**/*.json
            ${{ runner.temp }}/fresh-rtl/**/*.log
            ${{ runner.temp }}/qwen17-protected-kv/**/*.json
            ${{ runner.temp }}/qwen17-protected-kv/**/*.log

  qwen17-prefetch:
    name: Qwen 1.7B paired prefetch component comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the immutable official Verilator image
        run: |
          RTL_CI_IMAGE=$(python3 -I -S -B -c 'import json; print(json.load(open("tools/hardware_ci/toolchain.json"))["container"])')
          docker pull "$RTL_CI_IMAGE"
          docker image inspect "$RTL_CI_IMAGE" > "$RUNNER_TEMP/prefetch-image.json"
      - name: Prepare, build and compare the 23 fixed component cases
        run: |
          RTL_CI_IMAGE=$(python3 -I -S -B -c 'import json; print(json.load(open("tools/hardware_ci/toolchain.json"))["container"])')
          for phase in prepare build run; do
            docker run --rm --network none --cpus 1 --memory 4g \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP,dst=/out" \
              --entrypoint python3 "$RTL_CI_IMAGE" -I -S -B \
              /repo/demos/qwen3-1.7b/variants/protected-kv-simulation/prefetch/run.py \
              "$phase" --output /out/qwen17-prefetch --max-seconds 3600
          done
      - name: Retain paired prefetch commands, logs and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen17-prefetch-component-receipts
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/prefetch-image.json
            ${{ runner.temp }}/qwen17-prefetch/**/*.json
            ${{ runner.temp }}/qwen17-prefetch/**/*.log

  combined-simplestories:
    name: Combined SimpleStories model replacement, replay and expiry (simulation)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned Verilator and NumPy toolchain
        run: |
          docker build -t combined-simplestories-toolchain demos/simplestories-v2-5m/variants/combined-security-simulation/toolchain
          docker image inspect combined-simplestories-toolchain > "$RUNNER_TEMP/combined-toolchain.json"
      - name: Replay real model replacement, stale K/V, grant isolation and expiry
        run: |
          docker run --rm --init --network none --cpus 1 --memory 4g \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/out" \
            --entrypoint python3 combined-simplestories-toolchain -I -B \
            /repo/demos/simplestories-v2-5m/variants/combined-security-simulation/run.py --output /out/combined-simplestories
      - name: Retain source seals, real case logs and independent checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: combined-simplestories-simulation-receipts
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/combined-toolchain.json
            ${{ runner.temp }}/combined-simplestories/**/*.json
            ${{ runner.temp }}/combined-simplestories/**/*.log
            ${{ runner.temp }}/combined-simplestories/**/actual-*.memh
