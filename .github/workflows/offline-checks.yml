name: Offline release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: File integrity and Python helper tests (not hardware signoff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the clean release inventory
        run: python -I -S -B tools/verify_release.py --strict
      - name: Check encrypted-memory source bindings and reproduce the public-key ciphertext
        run: |
          python -I -S -B tools/check_encrypted_memory.py
          python -I -S -B tools/encrypt_model_image.py
          python -I -S -B tools/check_encrypted_board_evidence.py
      - name: Check current evidence and explicit browser phase (recorded checks, no hardware)
        run: python -I -S -B tools/check_current_release.py --require-complete
      - name: Check fresh current scoped formal completion
        run: python -I -S -B formal/current-seeded-sampling/check_recorded.py --require-complete
      - name: Check current seeded records and authenticated historical fixtures
        run: |
          python -I -S -B tools/check_seeded_sampling.py
          python -I -S -B tools/check_seeded_matched128.py
          python -I -S -B tools/check_seeded_context.py
          python -I -S -B tools/check_seeded_domain.py
          python -I -S -B tools/check_seeded_recovery.py
          python -I -S -B tools/check_seeded_around.py
          python -I -S -B tools/check_seeded_browser.py
          python -I -S -B tools/check_seeded_numerical_reference.py
          python -I -S -B reference/seeded-sampling/check_package.py
          python -I -S -B formal/seeded-sampling/check_recorded.py
          python -I -S -B -m unittest discover -s formal/seeded-sampling -p 'test_*.py' -v
          python -I -S -B -m unittest discover -s variants/seeded-sampling/tests -p 'test_*.py' -v
          python -I -S -B -m unittest discover -s host-app -p 'test_seeded_build.py' -v
      - name: Check the photograph for embedded metadata
        run: python -I -S -B tools/check_photo_metadata.py
      - name: Check protected-variant source bindings and measured comparisons
        run: python -I -S -B tools/check_kv_protected.py
      - name: Check historical speed revision and measurement arithmetic
        run: python -I -S -B tools/check_leaf_speed.py
      - name: Check current protected and encrypted speed measurements
        run: python -I -S -B tools/check_speed_release.py
      - name: Check current baseline speed measurements and recorded replay
        run: python -I -S -B tools/check_baseline_speed.py
      - name: Replay the runtime weight-authentication cost experiment
        run: python -I -S -B tools/check_weight_authentication_cost.py
      - name: Check recorded protected-KV proof bindings (not a solver replay)
        run: python -I -S -B tools/check_kv_integrity.py --package . --recorded-only
      - name: Recompute conditional training-capacity estimates
        run: python -I -S -B tools/estimate_training_capacity.py --check
      - name: Check architecture work counts and recorded-workload comparisons
        run: python -I -S -B tools/architecture_work_counts.py --check
      - name: Check the recorded H100 evidence
        run: python -I -S -B tools/check_h100_reference.py
      - name: Replay the recorded Qwen token and timing measurements (no AWS access)
        run: python -I -S -B tools/check_qwen_measurements.py
      - name: Check Qwen frozen sources, implementation reports and reference records
        run: |
          python -I -S -B tools/check_qwen_package.py
          python -I -S -B -m unittest discover -s demos/qwen3-1.7b/tools -p 'test_package_checks.py' -v
      - name: Check Qwen3-8B sources and recorded evidence
        # Qwen3-8B checks recorded evidence; no cloud access or model download.
        run: python -I -S -B demos/qwen3-8b/tools/check_package.py
      - name: Run the shared offline helper tests
        run: python -I -S -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check proof-log and constraint validators (no formal tools)
        run: python -I -S -B -m unittest discover -s formal/kv-integrity -p test_contract_auditor.py -v
      - name: Confirm that the checks left the release unchanged
        run: python -I -S -B tools/verify_release.py --strict

  qwen-app:
    name: Qwen browser and controller fixtures (no FPGA access)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned browser dependencies
        run: python -m pip install -r demos/qwen3-1.7b/host/requirements-browser.txt
      - name: Test the browser and runtime with fixture replies
        run: python -B -m unittest discover -s demos/qwen3-1.7b/host -p 'test_*.py' -v
      - name: Test the SimpleStories browser, sampling controls and local profiles with fixture replies
        run: python -B -m unittest discover -s host-app -p 'test_*.py' -v
