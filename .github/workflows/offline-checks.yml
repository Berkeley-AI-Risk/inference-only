name: Offline release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: File integrity and recorded evidence (no hardware signoff)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check the clean selected release inventory
        run: python -I -S -B tools/verify_release.py --strict
      - name: Reproduce the unchanged public-key ciphertext
        working-directory: demos/simplestories-v2-5m
        run: |
          python -I -S -B tools/encrypt_model_image.py
          python -I -S -B tools/check_encrypted_inherited_components_v1.py
      - name: Check recorded seeded evidence in its original host source context
        working-directory: demos/simplestories-v2-5m
        run: python -I -S -B tools/check_current_seeded_recorded_v1.py --require-complete
      - name: Check registered current RTL control proof completion (no solver replay)
        working-directory: demos/simplestories-v2-5m
        run: |
          python -I -S -B formal/current-seeded-sampling/check_recorded.py --require-complete
          python -I -S -B -m unittest discover -s formal/current-seeded-sampling -p 'test_*.py' -v
      - name: Check current inference-only implementation evidence (recorded only)
        working-directory: demos/simplestories-v2-5m
        run: python -I -S -B tools/check_implementation_assurance.py
      - name: Check current authentication and access evidence (recorded only)
        working-directory: demos/simplestories-v2-5m
        run: python -I -S -B formal/authentication-access/check_recorded.py
      - name: Check selected S-AWIC repair sources, timing, proofs and board evidence (recorded only)
        run: python -I -S -B tools/check_repaired_sawic.py --output "$RUNNER_TEMP/sawic-repair"
      - name: Test fresh Tang replay workspace (no compiler or hardware)
        run: python -I -S -B -m unittest discover -s tools -p 'test_sawic_replay_workspace.py' -v
      - name: Check protected-K/V CLEAR epoch proof and corruption controls (recorded only)
        run: |
          python -I -S -B demos/simplestories-v2-5m/formal/kv-clear-epoch/run.py --recorded-only --out "$RUNNER_TEMP/clear-epoch-recorded" --model demos/simplestories-v2-5m
          python -I -S -B demos/simplestories-v2-5m/formal/kv-clear-epoch/self_test.py --out "$RUNNER_TEMP/clear-epoch-checks" --model demos/simplestories-v2-5m
      - name: Test assertion-mode refusal and failed-engine handling
        run: python -I -S -B -m unittest discover -s tools -p 'test_formal_assertion_mode.py' -v
      - name: Test checked Qwen build and packaging controls
        run: python -I -S -B tools/test_qwen_build.py
      - name: Check composed model-read proof packet (recorded only)
        run: python -I -S -B demos/simplestories-v2-5m/formal/upstream-model-values/run.py --recorded-only
      - name: Check baseline Q operand-provenance proof packet (recorded only)
        run: python -I -S -B demos/simplestories-v2-5m/formal/q-operand-provenance/run.py --recorded-only
      - name: Check complete baseline Q operator proof packet (recorded only)
        run: |
          python -I -S -B demos/simplestories-v2-5m/formal/q-operator/check_statement.py
          python -I -S -B demos/simplestories-v2-5m/formal/q-operator/run.py --recorded-only --out "$RUNNER_TEMP/q-operator-recorded" --model demos/simplestories-v2-5m
      - name: Check baseline RMSNorm through Q and query RAM (recorded only)
        run: python -I -S -B demos/simplestories-v2-5m/formal/rms-q-segment/run.py --recorded-only --out "$RUNNER_TEMP/rms-q-segment-recorded" --model demos/simplestories-v2-5m
      - name: Check native component-value proof packet (recorded only)
        run: python -I -S -B demos/simplestories-v2-5m/formal/native-component-values/run.py --recorded-only
      - name: Check working-memory ownership and cancellation evidence (recorded only)
        working-directory: demos/simplestories-v2-5m
        run: |
          python -I -S -B formal/session-isolation/check_recorded.py
          python -I -S -B -m unittest discover -s formal/session-isolation -p 'test_*.py' -v
          python -I -S -B formal/kv-return/replay.py --packet evidence/kv-return --recorded-only
          python -I -S -B -m unittest discover -s formal/kv-return -p 'test_*.py' -v
      - name: Check the independent seeded model reference and client fixtures
        working-directory: demos/simplestories-v2-5m
        run: |
          python -I -S -B reference/seeded-sampling/check_package.py
          python -I -S -B -m unittest discover -s variants/seeded-sampling/tests -p 'test_*.py' -v
      - name: Check the photograph for embedded metadata
        working-directory: demos/simplestories-v2-5m
        run: python -I -S -B tools/check_photo_metadata.py
      - name: Recompute selected-image conditional capacity calculations
        # Explicit conditional assumptions; no training attack or certified bound.
        run: |
          python -I -S -B demos/simplestories-v2-5m/tools/estimate_training_capacity.py --check
          python -I -S -B tools/architecture_work_counts.py --check
      - name: Check reported timing and maintenance helpers
        run: |
          python -I -S -B demos/simplestories-v2-5m/tools/check_timing_disclosure.py
          python -I -S -B tools/test_release_hygiene.py
      - name: Check recorded H100 and Qwen evidence
        run: |
          python -I -S -B demos/simplestories-v2-5m/tools/check_h100_reference.py
          python -I -S -B tools/check_qwen_measurements.py
          python -I -S -B tools/qwen_h100_results.py --check
          python -I -S -B tools/fpga_speed_benchmark.py --check
          python -I -S -B tools/check_qwen_package.py
          python -I -S -B -m unittest discover -s demos/qwen3-1.7b/tools -p 'test_package_checks.py' -v
          python -I -S -B demos/qwen3-8b/tools/check_package.py
      - name: Test retained independent helper boundaries
        # Explicit module list avoids importing old-release ZIP dispatchers.
        run: |
          for test in test_architecture_work_counts.py test_qwen_measurements.py test_verify_release.py test_fpga_speed_benchmark.py test_qwen_h100_results.py test_qwen_training_capacity.py test_home_authorization_evidence.py; do
            python -I -S -B -m unittest discover -s tools -p "$test" -v
          done
          for test in test_fetch_vendor.py test_flash_layout.py test_h100_reference.py test_kv_integrity_runner.py test_model_rtl.py test_photo_metadata.py test_replay_diagnostics.py test_training_capacity.py test_current_seeded_recorded_v1.py test_encrypted_inherited_components_v1.py; do
            python -I -S -B -m unittest discover -s demos/simplestories-v2-5m/tools -p "$test" -v
          done
      - name: Test proof-log and constraint validators (no formal tools)
        # Generic validator refusal fixtures do not credit old image proofs to
        # any current circuit. Current-design proof bindings are checked below.
        working-directory: demos/simplestories-v2-5m
        run: python -I -S -B -m unittest discover -s formal/kv-integrity -p test_contract_auditor.py -v
      - name: Check Qwen disclosure, campaign and component harness helpers
        run: |
          python -I -S -B tools/check_qwen_disclosures.py
          python -I -S -B tools/test_qwen_disclosures.py
          python -I -S -B tools/test_qwen8b_training_capacity.py
          python -I -S -B demos/qwen3-8b/tools/test_reference_campaign.py
          python -I -S -B demos/qwen3-8b/tests/rtl/test_runner.py
          python -I -S -B demos/qwen3-8b/tests/rtl/test_norm_runner.py
          python -I -S -B demos/qwen3-8b/reference/run_campaign.py --check-record demos/qwen3-8b/evidence/software-campaign-2026-11-05/result.json
      - name: Check recorded HWIC feasibility arithmetic
        run: python -I -S -B research/hwic/evidence/memory-profile-2026-11-05/check_feasibility.py --check
      - name: Check recorded HWIC attention profile arithmetic
        run: python -I -S -B research/hwic/evidence/attention-profile-2026-11-05/check_recorded_profile.py
      - name: Check the six selected Tang source configurations
        run: |
          python -I -S -B demos/simplestories-v2-5m/tools/check_configuration_sources.py
          python -I -S -B -m unittest discover -s demos/simplestories-v2-5m/tools -p 'test_configuration_sources.py' -v
      - name: Check the selected Qwen source configurations
        run: |
          python -I -S -B demos/qwen3-1.7b/tools/check_configuration.py
          python -I -S -B -m unittest discover -s demos/qwen3-1.7b/tools -p 'test_configuration.py' -v
          python -I -S -B demos/qwen3-8b/tools/check_configuration.py
          python -I -S -B demos/qwen3-8b/tools/test_configuration.py
      - name: Check HWIC configuration and reuse records
        run: |
          python -I -S -B research/hwic/evidence/configuration-map-2026-11-06/check_rows.py
          python -I -S -B -m unittest discover -s research/hwic/tools -p 'test_configuration_rows.py' -v
      - name: Test selected-image replacement metadata boundaries
        run: python -I -S -B -m unittest discover -s tools -p 'test_sawic_selection_metadata.py' -v
      - name: Check selected documentation links
        run: python -I -S -B tools/check_release_hygiene.py --root . --contract tools/release-contract.json --output "$RUNNER_TEMP/release-links.json" --links-only --fail-on-findings
      - name: Confirm that the checks left the release unchanged
        run: python -I -S -B tools/verify_release.py --strict

  browser-and-current-evidence:
    name: Browser fixtures and three current greedy evidence capsules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned browser dependencies
        run: python -m pip install -r demos/qwen3-1.7b/host/requirements-browser.txt
      - name: Test the Qwen browser and runtime with fixture replies
        run: python -B -m unittest discover -s demos/qwen3-1.7b/host -p 'test_*.py' -v
      - name: Test the common SimpleStories host and seeded controls with fixture replies
        working-directory: demos/simplestories-v2-5m
        run: python -B -m unittest discover -s host-app -p 'test_*.py' -v
      - name: Derive all three current greedy capsule results and exact shared host bindings
        # tokenizers0.23.2 is required to independently decode recorded browser
        # text. Keep site packages available; never add -S to this invocation.
        working-directory: demos/simplestories-v2-5m
        run: python -I -B tools/check_current_three_greedy_v15_v4.py --package . --stage current --index evidence/current-greedy/INDEX.json
      - name: Confirm that the checks left the release unchanged
        run: python -I -S -B tools/verify_release.py --strict

