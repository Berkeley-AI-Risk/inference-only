name: Fresh scoped proofs and decoder checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clear-epoch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install digest-pinned proof tools
        run: >-
          python3.12 -I -S -B demos/simplestories-v2-5m/formal/kv-clear-epoch/install_linux.py
          --out "$RUNNER_TEMP/formal-tools"
      - name: Recompile production RTL and reprove all selected obligations
        run: >-
          python3.12 -I -S -B demos/simplestories-v2-5m/formal/kv-clear-epoch/recompute.py
          --model demos/simplestories-v2-5m --out "$RUNNER_TEMP/clear-epoch-linux"
          --tool-receipt "$RUNNER_TEMP/formal-tools/TOOLS.json"
          --workers 2 --memory-mb 4096 --timeout 120 --total-timeout 900
      - name: Reproduce the two Qwen model-address decoders
        run: >-
          python3.12 -I -S -B tools/model_size_reuse/run.py
          --tool-receipt "$RUNNER_TEMP/formal-tools/TOOLS.json"
          --output "$RUNNER_TEMP/qwen-decoder-reuse"
      - name: Recompile and reprove baseline STEP/CLEAR reply ownership
        run: >-
          python3.12 -I -S -B demos/simplestories-v2-5m/formal/public-control-ownership/run.py
          --fresh --repository-root .
          --tool-receipt "$RUNNER_TEMP/formal-tools/TOOLS.json"
          --output "$RUNNER_TEMP/public-control-fresh"
      - name: Prove native selector WINNER and replay its wrong-tie control
        run: >-
          python3.12 -I -S -B demos/simplestories-v2-5m/formal/selector-winner/run.py
          --repository-root .
          --tool-receipt "$RUNNER_TEMP/formal-tools/TOOLS.json"
          --output "$RUNNER_TEMP/selector-winner"
      - name: Preserve proof, decoder and tool receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scoped-proof-and-decoder-replay
          path: |
            ${{ runner.temp }}/clear-epoch-linux
            ${{ runner.temp }}/formal-tools/TOOLS.json
            ${{ runner.temp }}/qwen-decoder-reuse
            ${{ runner.temp }}/public-control-fresh/RESULT.json
            ${{ runner.temp }}/public-control-fresh/FAILURE.json
            ${{ runner.temp }}/public-control-fresh/RECORDED-RESULT.json
            ${{ runner.temp }}/public-control-fresh/TOOLS.json
            ${{ runner.temp }}/public-control-fresh/fresh
            ${{ runner.temp }}/public-control-fresh/fresh-models
            ${{ runner.temp }}/public-control-fresh/queries
            ${{ runner.temp }}/selector-winner
          if-no-files-found: error
          retention-days: 7
