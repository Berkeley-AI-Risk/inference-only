eight="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1120" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1120" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1134" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1134" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1148" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1148" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1162" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1162" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1176" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1176" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1190" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1190" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1204" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1204" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1218" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="1218" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="841" y="180" width="391" height="366" rx="10" fill="#101f38" stroke="none" stroke-width="1.5"/><text x="69" y="222" font-size="27" font-weight="700" fill="#ffffff" text-anchor="start">Rank 7</text><text x="69" y="249" font-size="17" font-weight="400" fill="#c5d6e9" text-anchor="start">Sending die</text><text x="862" y="222" font-size="27" font-weight="700" fill="#ffffff" text-anchor="start">Rank 8</text><text x="862" y="249" font-size="17" font-weight="400" fill="#c5d6e9" text-anchor="start">Receiving die</text><rect x="69" y="272" width="349" height="74" rx="6" fill="#243c61" stroke="none" stroke-width="1.5"/><text x="83" y="301" font-size="20" font-weight="650" fill="#ffffff" text-anchor="start">Fixed projection datapath</text><text x="83" y="326" font-size="16" font-weight="400" fill="#c5d6e9" text-anchor="start">Produces a partial sum for its weight shard.</text><path d="M243 346 L243 374" fill="none" stroke="#c5d6e9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a4)"/><rect x="69" y="378" width="349" height="74" rx="6" fill="#243c61" stroke="none" stroke-width="1.5"/><text x="83" y="407" font-size="20" font-weight="650" fill="#ffffff" text-anchor="start">Authenticated transmitter</text><text x="83" y="432" font-size="16" font-weight="400" fill="#c5d6e9" text-anchor="start">Seals this chunk with the link session key.</text><text x="69" y="501" font-size="16" font-weight="550" fill="#f7d58c" text-anchor="start">Only the scheduled producer can send.</text><text x="640" y="221" font-size="21" font-weight="650" fill="#172c48" text-anchor="middle">Untrusted interconnect</text><rect x="473" y="264" width="334" height="117" rx="7" fill="#eaf3fb" stroke="#cfdae6" stroke-width="1.5"/><text x="640" y="295" font-size="19" font-weight="650" fill="#172c48" text-anchor="middle">Authenticated frame</text><text x="640" y="324" font-size="16" font-weight="400" fill="#53647b" text-anchor="middle">Encrypted partial sum + tag</text><text x="640" y="346" font-size="16" font-weight="400" fill="#53647b" text-anchor="middle">Bound to its sender, receiver and use</text><path d="M419 414 L861 414" fill="none" stroke="#13776f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a2)"/><path d="M640 381 L640 406" fill="none" stroke="#13776f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4"/><rect x="862" y="378" width="349" height="74" rx="6" fill="#243c61" stroke="none" stroke-width="1.5"/><text x="876" y="406" font-size="20" font-weight="650" fill="#ffffff" text-anchor="start">Verify before release</text><text x="876" y="431" font-size="16" font-weight="400" fill="#c5d6e9" text-anchor="start">Check tag, current slot and fresh generation.</text><path d="M1037 377 L1037 350" fill="none" stroke="#c5d6e9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a4)"/><rect x="862" y="272" width="349" height="74" rx="6" fill="#243c61" stroke="none" stroke-width="1.5"/><text x="876" y="301" font-size="20" font-weight="650" fill="#ffffff" text-anchor="start">Fixed reduction datapath</text><text x="876" y="326" font-size="16" font-weight="400" fill="#c5d6e9" text-anchor="start">Consumes this expected contribution once.</text><text x="862" y="501" font-size="16" font-weight="550" fill="#f7d58c" text-anchor="start">Stale or duplicate input cannot commit.</text><text x="640" y="458" font-size="16" font-weight="650" fill="#13776f" text-anchor="middle">Only scheduled inference messages</text><text x="640" y="482" font-size="16" font-weight="400" fill="#53647b" text-anchor="middle">travel on this link.</text><text x="640" y="520" font-size="15" font-weight="400" fill="#53647b" text-anchor="middle">Historical K/V stays at its owning rank.</text><rect x="48" y="587" width="1184" height="136" rx="10" fill="#f6f9fc" stroke="#cfdae6" stroke-width="1.5"/><text x="69" y="624" font-size="23" font-weight="700" fill="#172c48" text-anchor="start">What does the receiver expect?</text><text x="69" y="659" font-size="18" font-weight="400" fill="#53647b" text-anchor="start">The admitted model and group, the run and tape generation, the token position, layer and operation, the source and destination ranks,</text><text x="69" y="685" font-size="18" font-weight="400" fill="#53647b" text-anchor="start">and the reduction round, chunk and length. CLEAR invalidates pending work from the old generation before it can reach arithmetic.</text><path d="M48 757 L1232 757" fill="none" stroke="#53647b" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="786" font-size="17" font-weight="600" fill="#172c48" text-anchor="start">Authentication establishes who sent a message and whether it belongs here. Correct arithmetic also depends on each die’s fixed producer.</text><text x="48" y="814" font-size="16" font-weight="400" fill="#53647b" text-anchor="start">Proposed test: run one small model on one and two dies, compare intermediate sums and tokens, then replay a stale frame and check the receiver.</text></g></svg>
