<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-labelledby="title desc"><title id="title">How a partial sum crosses between dies</title><desc id="desc">The fixed sender produces a partial sum and seals an encrypted, authenticated frame. An untrusted link transports the frame. The receiver authenticates it, checks that it matches the locally expected current operation and consumes it once. A stale, duplicate or invalid frame cannot enter arithmetic. A valid tag cannot vouch for arithmetic on a compromised die.</desc><defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#172c48"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#2265a5"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#13776f"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#e4a12b"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#c5d6e9"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#ffffff"/></marker><marker id="a6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#933c44"/></marker><marker id="a7" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 L2 4.5 Z" fill="#53647b"/></marker></defs><g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="1280" height="840" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="48" y="43" font-size="14" font-weight="700" fill="#2265a5" text-anchor="start" letter-spacing="1.55">AWIC  /  PROPOSED ARCHITECTURE</text><text x="1232" y="43" font-size="15" font-weight="600" fill="#53647b" text-anchor="end">3 / 3</text><text x="48" y="88" font-size="40" font-weight="700" fill="#172c48" text-anchor="start">How a partial sum crosses between dies</text><text x="48" y="123" font-size="20" font-weight="400" fill="#53647b" text-anchor="start">One scheduled transfer during the output projection of a layer. The same rule applies to a feed-forward down projection.</text><rect x="61" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="61" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="75" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="75" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="89" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="89" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="103" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="103" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="117" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="117" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="131" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="131" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="145" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="145" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="159" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="159" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="173" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="173" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="187" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="187" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="201" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="201" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="215" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="215" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="229" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="229" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="243" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="243" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="257" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="257" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="271" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="271" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width=