 y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="425" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="48" y="180" width="391" height="366" rx="10" fill="#101f38" stroke="none" stroke-width="1.5"/><rect x="854" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="854" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="868" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="868" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="882" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="882" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="896" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="896" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="910" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="910" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="924" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="924" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="938" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="938" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="952" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="952" y="544" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="966" y="175" width="5" height="7" rx="0" fill="#93a3b5" stroke="none" stroke-width="1.5"/><rect x="966" y="544" width="