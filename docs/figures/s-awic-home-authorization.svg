<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" role="img" aria-labelledby="title description">
    <title id="title">S-AWIC with periodic reauthorization</title>
    <desc id="description">An optional S-AWIC feature. The host computer and chip are at the deployment site. The host forwards a fresh nonce, device ID and admitted model commitment to a potentially remote home base. Home base signs an approval only if policy permits that model. On-chip signature and binding checks grant temporary inference permission. Weight memory is external to the chip. On-chip model authentication checks update signatures and weight hashes; renewable home permission separately enables inference. Withholding renewal stops inference when permission expires; reset clears permission.</desc>
    <defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2867aa"/></marker>
    <marker id="ice" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a9cbea"/></marker>
    <marker id="gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#fdb515"/></marker></defs>
    <rect width="1240" height="850" fill="#ffffff"/>
    <g font-family="Inter, Helvetica Neue, Arial, sans-serif">
<text x="40" y="49" font-size="32" font-weight="600" fill="#003262" text-anchor="start">S-AWIC with periodic reauthorization</text>
<text x="40" y="85" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Optional S-AWIC feature: fresh model-specific approval is required to keep running.</text>
<rect x="360" y="110" width="860" height="650" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="585" y="96" width="410" height="30" rx="12" fill="#ffffff"/>
<text x="790" y="119" font-size="20" font-weight="600" fill="#003262" text-anchor="middle">Deployment site / datacenter</text>
<rect x="580" y="130" width="620" height="610" rx="12" fill="#0b1a33"/>
<text x="610" y="166" font-size="23" font-weight="600" fill="#ffffff" text-anchor="start">Inference-only chip · fixed circuitry</text>
<rect x="40" y="150" width="300" height="180" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="184" font-size="24" font-weight="600" fill="#003262" text-anchor="start">Home base</text>
<text x="64" y="214" font-size="20" font-weight="400" fill="#003262" text-anchor="start">Checks model allowlist</text>
<text x="64" y="273" font-size="20" font-weight="400" fill="#003262" text-anchor="start">Signs permitted requests</text>
<text x="64" y="305" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Private key stays here</text>
<rect x="375" y="174" width="150" height="232" rx="12" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 5"/>
<text x="450" y="274" font-size="18" font-weight="600" fill="#003262" text-anchor="middle">Host computer</text>
<text x="450" y="299" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">forwards</text>
<text x="450" y="322" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">messages</text>
<text x="450" y="430" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Transport only</text>
<rect x="610" y="200" width="560" height="76" rx="12" fill="#22355a"/>
<text x="635" y="230" font-size="21" font-weight="600" fill="#ffffff" text-anchor="start">Fresh nonce + device ID</text>
<text x="635" y="258" font-size="21" font-weight="400" fill="#a9cbea" text-anchor="start">+ admitted model commitment</text>
<path d="M610 237 H340" fill="none" stroke="#2867aa" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="470" y="219" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Request</text>
<path d="M190 330 V365 H610" fill="none" stroke="#2867aa" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="450" y="350" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">Signed approval</text>
<rect x="610" y="310" width="260" height="110" rx="12" fill="#22355a"/>
<text x="740" y="339" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">Check home signature</text>
<text x="740" y="371" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">Match nonce, device</text>
<text x="740" y="398" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">and admitted model</text>
<rect x="910" y="310" width="260" height="110" rx="12" fill="none" stroke="#fdb515" stroke-width="2"/>
<text x="1040" y="355" font-size="20" font-weight="600" fill="#fdb515" text-anchor="middle">Fixed home-base</text>
<text x="1040" y="384" font-size="20" font-weight="600" fill="#fdb515" text-anchor="middle">public key</text>
<path d="M910 365 H870" fill="none" stroke="#fdb515" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#gold)"/>
<path d="M740 420 V470" fill="none" stroke="#fdb515" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="757" y="453" font-size="18" font-weight="400" fill="#a9cbea" text-anchor="start">Valid approval</text>
<rect x="610" y="470" width="560" height="84" rx="12" fill="#22355a" stroke="#fdb515" stroke-width="2"/>
<text x="634" y="502" font-size="23" font-weight="600" fill="#ffffff" text-anchor="start">Time-limited permission to run this model</text>
<text x="634" y="531" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="start">Hardware countdown · expires without fresh approval</text>
<path d="M1040 554 V590" fill="none" stroke="#fdb515" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#gold)"/>
<text x="1023" y="578" font-size="18" font-weight="400" fill="#a9cbea" text-anchor="end">Enables inference</text>
<rect x="40" y="580" width="300" height="120" rx="12" fill="#2867aa"/>
<text x="64" y="613" font-size="23" font-weight="600" fill="#ffffff" text-anchor="start">Signed model package</text>
<text x="64" y="648" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">Weights + commitment</text>
<text x="64" y="677" font-size="20" font-weight="400" fill="#ffffff" text-anchor="start">k-of-n update signatures</text>
<rect x="610" y="590" width="260" height="110" rx="12" fill="#22355a"/>
<text x="740" y="621" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Model authentication</text>
<text x="740" y="650" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">Update signatures</text>
<text x="740" y="678" font-size="19" font-weight="400" fill="#e2e8f0" text-anchor="middle">+ weight hash checks</text>
<rect x="385" y="590" width="160" height="110" rx="12" fill="#2867aa"/>
<text x="465" y="621" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle">Weight memory</text>
<text x="465" y="651" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">Stored</text>
<text x="465" y="678" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">model data</text>
<path d="M340 654 H385" fill="none" stroke="#2867aa" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M545 654 H610" fill="none" stroke="#2867aa" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="910" y="590" width="260" height="110" rx="12" fill="#22355a"/>
<text x="1040" y="632" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Fixed inference</text>
<text x="1040" y="662" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">circuitry</text>
<path d="M870 654 H910" fill="none" stroke="#a9cbea" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#ice)"/>
<text x="1040" y="725" font-size="17" font-weight="400" fill="#a9cbea" text-anchor="middle">Runs this model only while permitted</text>
<text x="40" y="410" font-size="22" font-weight="600" fill="#003262" text-anchor="start">To revoke a model:</text>
<text x="40" y="440" font-size="21" font-weight="400" fill="#475569" text-anchor="start">home base withholds renewal.</text>
<text x="40" y="470" font-size="21" font-weight="400" fill="#475569" text-anchor="start">Inference stops by its deadline.</text>
<path d="M40 773 H1200" stroke="#cbd5e1" stroke-width="1"/>
<text x="40" y="805" font-size="21" font-weight="600" fill="#003262" text-anchor="start">Fresh challenge at startup and renewal. Reset clears permission.</text>
<text x="40" y="834" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Conceptual schematic · nonce freshness depends on the entropy source · no weight-update delay is shown.</text>
</g></svg>
