<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="title desc">
  <title id="title">Inference-only chip families</title>
  <desc id="desc">Inference-only chip (IC) branches to AWIC, HWIC, and an ellipsis indicating other possible types. AWIC branches to F-AWIC and S-AWIC.</desc>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <line x1="340" y1="62" x2="170" y2="130"/>
    <line x1="340" y1="62" x2="340" y2="130"/>
    <line x1="340" y1="62" x2="510" y2="130"/>
    <line x1="170" y1="174" x2="90" y2="242"/>
    <line x1="170" y1="174" x2="250" y2="242"/>
  </g>
  <g fill="#161b22" stroke="#8b949e" stroke-width="1.5">
    <rect x="190" y="18" width="300" height="44" rx="4"/>
    <rect x="105" y="130" width="130" height="44" rx="4"/>
    <rect x="275" y="130" width="130" height="44" rx="4"/>
    <rect x="445" y="130" width="130" height="44" rx="4"/>
    <rect x="15" y="242" width="150" height="44" rx="4"/>
    <rect x="175" y="242" width="150" height="44" rx="4"/>
  </g>
  <g fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" text-anchor="middle">
    <text x="340" y="47">inference-only chip (IC)</text>
    <text x="170" y="159">AWIC</text>
    <text x="340" y="159">HWIC</text>
    <text x="510" y="159">...</text>
    <text x="90" y="271">F-AWIC</text>
    <text x="250" y="271">S-AWIC</text>
  </g>
</svg>
